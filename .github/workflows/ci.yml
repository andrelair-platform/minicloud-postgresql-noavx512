name: Build and Push

# ghcr-only (Harbor decommissioned 2026-11-16). The postgresql package is linked to minicloud-gitops
# (crane-copied during the decommission) → login with GITOPS_TOKEN (write:packages).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  GHCR_IMAGE: ghcr.io/andrelair-platform/postgresql

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - name: Set image tag
        id: meta
        run: |
          # Tag tracks the upstream postgresql version it patches (e.g. 18.4.0-noavx512).
          echo "tag=$(grep 'FROM.*postgresql' Dockerfile | head -1 | sed 's/.*://;s/ .*//')-noavx512" >> $GITHUB_OUTPUT

      - name: Login to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: AndreLiar
          password: ${{ secrets.GITOPS_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.GHCR_IMAGE }}:${{ steps.meta.outputs.tag }}
            ${{ env.GHCR_IMAGE }}:latest-noavx512
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install Cosign
        if: github.ref == 'refs/heads/main'
        uses: sigstore/cosign-installer@v3

      - name: Sign image
        if: github.ref == 'refs/heads/main'
        run: |
          cosign sign --yes ${{ env.GHCR_IMAGE }}@${{ steps.build.outputs.digest }}
